<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For My Love</title>
<style>
  :root{
    --pink-deep:#c9184a;
    --pink-mid:#ff6b9d;
    --pink-soft:#ffc2d6;
    --cream:#fff0f5;
    --ink:#4a1027;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    overflow:hidden;
    background:linear-gradient(160deg,var(--cream) 0%,var(--pink-soft) 55%,var(--pink-mid) 100%);
    font-family:'Georgia','Times New Roman',serif;
    -webkit-tap-highlight-color:transparent;
  }
  #heartsLayer{
    position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1;
  }
  .floatHeart{
    position:absolute;
    bottom:-10%;
    font-size:1.6rem;
    opacity:0.85;
    animation:rise linear infinite;
    will-change:transform;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:0;}
    10%{opacity:0.9;}
    100%{transform:translateY(-115vh) translateX(var(--drift,20px)) rotate(360deg);opacity:0;}
  }
  .scene{
    position:relative;z-index:2;
    height:100%;width:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:24px;
  }
  .scene.hidden{display:none;}
  .emoji-pair{
    font-size:clamp(2.8rem,10vw,4.5rem);
    margin-bottom:18px;
    animation:pulse 1.6s ease-in-out infinite;
    letter-spacing:12px;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.12);}
  }
  h1{
    color:var(--ink);
    font-size:clamp(1.4rem,5vw,2.2rem);
    max-width:600px;
    line-height:1.4;
    margin:0 0 34px 0;
    text-shadow:0 2px 8px rgba(255,255,255,0.6);
  }
  .btn-row{
    position:relative;
    display:flex;
    gap:24px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    width:100%;
    max-width:520px;
    min-height:90px;
  }
  button{
    font-family:inherit;
    font-size:clamp(1rem,3.6vw,1.25rem);
    padding:14px 34px;
    border-radius:50px;
    border:none;
    cursor:pointer;
    font-weight:600;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .yesBtn{
    background:linear-gradient(135deg,var(--pink-mid),var(--pink-deep));
    color:#fff;
    box-shadow:0 8px 20px rgba(201,24,74,0.35);
  }
  .yesBtn:hover{transform:scale(1.06);}
  .yesBtn:active{transform:scale(0.97);}
  .noBtn{
    background:#fff;
    color:var(--pink-deep);
    border:2px solid var(--pink-mid);
    position:relative;
  }
  .noBtn.runaway{
    position:fixed;
    transition:top 0.18s ease, left 0.18s ease;
  }
  .final-emoji{
    font-size:clamp(3rem,12vw,5rem);
    margin-bottom:16px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  .final-msg{
    color:var(--ink);
    font-size:clamp(1.3rem,5vw,2rem);
    max-width:600px;
    line-height:1.5;
    font-style:italic;
  }
</style>
</head>
<body>

<div id="heartsLayer"></div>

<!-- Scene 1: She's upset -->
<section class="scene" id="scene1">
  <div class="emoji-pair">😢💔</div>
  <h1>I know you're upset with me right now...<br>but let me make it right. Will you let me try?</h1>
  <div class="btn-row" id="row1">
    <button class="yesBtn" id="yes1">Yes, cheer me up 🥺</button>
    <button class="noBtn" id="no1">No</button>
  </div>
</section>

<!-- Scene 2: Ask her on a date -->
<section class="scene hidden" id="scene2">
  <div class="emoji-pair">😍❤️</div>
  <h1>That's my girl. Now...<br>Will you go on a date with me?</h1>
  <div class="btn-row" id="row2">
    <button class="yesBtn" id="yes2">Yes 💕</button>
    <button class="noBtn" id="no2">No</button>
  </div>
</section>

<!-- Scene 3: Final message -->
<section class="scene hidden" id="scene3">
  <div class="final-emoji">🥰💖</div>
  <p class="final-msg">Ahh my love, I knew it.<br>You should know by now... you're stuck loving me forever. ❤️</p>
</section>

<script>
  // ---------- Floating hearts background ----------
  const heartsLayer = document.getElementById('heartsLayer');
  const heartEmojis = ['❤️','💕','💖','💗','💓','💞'];

  function spawnHeart(){
    const h = document.createElement('div');
    h.className = 'floatHeart';
    h.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
    const startLeft = Math.random()*100;
    const duration = 6 + Math.random()*6;
    const drift = (Math.random()*160 - 80) + 'px';
    const size = 1.2 + Math.random()*1.8;
    h.style.left = startLeft + 'vw';
    h.style.fontSize = size + 'rem';
    h.style.setProperty('--drift', drift);
    h.style.animationDuration = duration + 's';
    heartsLayer.appendChild(h);
    setTimeout(()=>h.remove(), duration*1000 + 500);
  }
  setInterval(spawnHeart, 300);
  for(let i=0;i<12;i++) setTimeout(spawnHeart, i*150);

  // ---------- Runaway "No" button logic ----------
  function makeRunaway(btn, container){
    let dodges = 0;
    function dodge(e){
      dodges++;
      const margin = 20;
      const btnRect = btn.getBoundingClientRect();
      const maxX = window.innerWidth - btnRect.width - margin;
      const maxY = window.innerHeight - btnRect.height - margin;
      const newX = Math.max(margin, Math.random()*maxX);
      const newY = Math.max(margin, Math.random()*maxY);

      if(!btn.classList.contains('runaway')){
        btn.classList.add('runaway');
      }
      btn.style.left = newX + 'px';
      btn.style.top = newY + 'px';

      // grow the yes button a bit each time, for fun
      const yesBtn = container.querySelector('.yesBtn');
      if(yesBtn){
        const scale = Math.min(1.5, 1 + dodges*0.05);
        yesBtn.style.transform = 'scale(' + scale + ')';
      }
    }
    // desktop: run from hover / mouse proximity
    btn.addEventListener('mouseenter', dodge);
    // mobile: run from touch attempt before it registers as a tap
    btn.addEventListener('touchstart', function(e){
      e.preventDefault();
      dodge(e);
    }, {passive:false});
    // also dodge on click, just in case it gets touched
    btn.addEventListener('click', function(e){
      e.preventDefault();
      dodge(e);
    });
  }

  const row1 = document.getElementById('row1');
  const row2 = document.getElementById('row2');
  makeRunaway(document.getElementById('no1'), row1);
  makeRunaway(document.getElementById('no2'), row2);

  // ---------- Scene transitions ----------
  const scene1 = document.getElementById('scene1');
  const scene2 = document.getElementById('scene2');
  const scene3 = document.getElementById('scene3');

  document.getElementById('yes1').addEventListener('click', () => {
    scene1.classList.add('hidden');
    scene2.classList.remove('hidden');
  });

  document.getElementById('yes2').addEventListener('click', () => {
    scene2.classList.add('hidden');
    scene3.classList.remove('hidden');
  });

  // keep runaway buttons within bounds on resize
  window.addEventListener('resize', () => {
    document.querySelectorAll('.noBtn.runaway').forEach(btn=>{
      const rect = btn.getBoundingClientRect();
      const maxX = window.innerWidth - rect.width - 20;
      const maxY = window.innerHeight - rect.height - 20;
      btn.style.left = Math.min(parseFloat(btn.style.left||0), maxX) + 'px';
      btn.style.top = Math.min(parseFloat(btn.style.top||0), maxY) + 'px';
    });
  });
</script>

</body>
</html>
